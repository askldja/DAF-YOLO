nc: 10
scales:
  n: [0.50, 0.25, 1024]
backbone:
  - [-1, 1, Conv,                       [64, 3, 2]]                   # 0
  - [-1, 1, Conv,                       [128, 3, 2]]                  # 1
  - [-1, 2, C3k2_SDLKA_S,                   [256, False, 0.25]]           # 2
  - [-1, 1, SCDown,                     [256, 3, 2]]                  # 3
  - [-1, 2, C3k2_SDLKA_M_Scaled,       [512, False, 0.25]]           # 4  P3 128ch
  - [-1, 1, SCDown,                     [512, 3, 2]]                  # 5
  - [-1, 2, C3k2_SDLKA_L,               [512, True]]                  # 6  P4 128ch
  - [-1, 1, SCDown,                     [1024, 3, 2]]                 # 7
  - [-1, 2, C3k2_SDLKA_L,               [1024, True]]                 # 8  P5 256ch
  - [-1, 1, SPPF,                       [1024, 5]]                    # 9  256ch
  - [-1, 2, C2PSA, [1024]]

head:
  # DASSAFM：用P3/P4/P5三层，输出增强后的enh_p3（128ch）
  - [[4, 6, 10], 1, DASSAFMBlock,       [True]]                       # 11 128ch

  # top-down FPN
  - [10, 1, nn.Upsample,                [None, 2, "nearest"]]         # 12
  - [[-1, 6], 1, Concat,                [1]]                          # 13 256ch
  - [-1, 2, C3k2,                       [512, False]]                 # 14 128ch

  - [-1, 1, nn.Upsample,                [None, 2, "nearest"]]         # 15
  - [[-1, 11], 1, Concat,               [1]]                          # 16 256ch ← 用enh_p3
  - [-1, 2, C3k2,               [512, False]]                 # 17 128ch ← P3检测层

  # bottom-up PAN
  - [-1, 1, SCDown,                     [512, 3, 2]]                  # 18
  - [[-1, 14], 1, Concat,               [1]]                          # 19 256ch
  - [-1, 1, C3k2,                       [512, False]]                 # 20 128ch ← P4检测层

  - [-1, 1, SCDown,                     [512, 3, 2]]                  # 21
  - [[-1, 10], 1, Concat,               [1]]                          # 22 256ch
  - [-1, 1, C3k2,                       [1024, True]]                 # 23 256ch ← P5检测层

  - [[17, 20, 23], 1, LSDDetect,        [nc]]